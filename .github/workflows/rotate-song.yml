name: Rotar Canción del Perfil

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  rotate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rotar canción en README
        run: python rotate_song.py

      - name: Guardar y subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: rotar canción favorita del perfil" && git push)
